# %USERPROFILE%\.wslconfig -- genere par le Reset Pack (modules/14-ml.ps1) depuis templates/wslconfig.ini.
# Une modif a la main est ecrasee au prochain run (l'ancien fichier est sauvegarde a cote, horodate) :
# change plutot ce modele. Pour appliquer : wsl --shutdown (arrete aussi Docker Desktop).
# Cf. SYSTEME-OMEN-35L.md, section 5 (deep learning).

[wsl2]
# Budget RAM fixe de la VM : ~56 % de la RAM physique (18GB pour 32 Go, 36GB pour 64 Go).
memory={{MEMORY}}
# Coeurs logiques moins 2 a 4 : Windows garde de la marge (jeu, Docker Desktop, navigateur).
processors={{PROCESSORS}}
swap=16GB

[experimental]
# Rend progressivement a Windows la RAM liberee par Linux (cache disque inclus).
autoMemoryReclaim=gradual
# VHDX ext4 compacte automatiquement (nouveaux disques ; distro existante : wsl --manage <distro> --set-sparse true).
sparseVhd=true
